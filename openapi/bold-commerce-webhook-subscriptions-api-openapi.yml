                    schema:
                      $ref: '#/components/schemas/SubscriptionEntity'
              responses:
                '200':
                  description: Successful operation
        Upcoming order:
          '{$request.body#/webhook_subscription.callback_url}':
            parameters:
            - $ref: '#/components/parameters/event_actor_type_header'
