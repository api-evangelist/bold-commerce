openapi: 3.2.0
info:
  title: Bold Subscriptions Webhook Subscriptions API
  version: '1.0'
  description: 'Bold Subscriptions customers use our API to interact with subscription data in unique ways. This includes the ability to modify, cancel, and report on subscriptions.


    Refer to the changelog for the latest updates to this API.'
  termsOfService: https://boldcommerce.com/terms-of-service
  contact:
    name: Contact Us
    url: https://developer-dashboard.boldcommerce.com/default/contactus
servers:
- url: https://api.boldcommerce.com
security:
- OAuthToken: []
- APIAccessToken: []
tags:
- name: Webhook Subscriptions
  description: Contains webhook metadata. Use these endpoints to add, remove, edit, or list webhook subscriptions.
paths:
  /subscriptions/v1/shops/{shop_identifier}/webhooks/subscriptions:
    parameters:
    - $ref: '#/components/parameters/shop_identifier_path_param'
    get:
      summary: List Webhook Subscriptions
      operationId: ListWebhookSubscriptions
      tags:
      - Webhook Subscriptions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptions'
              examples:
                example:
                  value:
                    webhook_subscriptions:
                    - id: 1
                      shop_id: 1
                      webhook_topic_id: 1
                      callback_url: yourapp.com/v2/sub-created
                      created_at: '2020-09-17T18:27:03Z'
                      updated_at: '2020-09-17T18:27:03Z'
                      deleted_at: null
                    - id: 1
                      shop_id: 1
                      webhook_topic_id: 2
                      callback_url: yourapp.com/sub-updated
                      created_at: '2020-08-17T18:27:03Z'
                      updated_at: '2020-08-17T18:27:03Z'
                      deleted_at: null
                    pagination:
                      limit: 10
                      count: 2
                      total: 2
                      total_pages: 1
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: Retrieve a list of webhook subscriptions.
      parameters:
      - schema:
          type: integer
        in: query
        name: since_id
        description: ''
      - schema:
          type: string
        in: query
        name: limit
        description: Maximum number of results to be returned
      - schema:
          type: array
          items:
            type: string
            enum:
            - webhook_topic_id
            - callback_url
            - shared_secret
            - created_at
            - updated_at
        in: query
        name: filters
        description: Filter subscription webhooks. Multiple filters can be passed in the array.
    post:
      summary: Create Webhook Subscription
      operationId: CreateWebhookSubscription
      tags:
      - Webhook Subscriptions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: 'Create a webhook subscription. For more information, refer to Register for Webhooks.


        The `subscription_payment_method_updated` webhook is not supported by default for all Shopify shops installed prior to January 15th 2024 (2024-01-15). Please submit a support request for access.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_subscription:
                  type: object
                  required:
                  - webhook_topic_id
                  - callback_url
                  - shared_secret
                  properties:
                    webhook_topic_id:
                      type: integer
                      example: 10
                      minimum: 1
                      maximum: 10
                    callback_url:
                      type: string
                      format: uri
                      example: https://webhooks.shop.com
                    shared_secret:
                      type: string
                      example: exMh194qw8JD@A50dA^P
              required:
              - webhook_subscription
      callbacks:
        Subscription created:
          '{$request.body#/webhook_subscription.callback_url}':
            parameters:
            - $ref: '#/components/parameters/event_actor_type_header'
            - $ref: '#/components/parameters/shop_identifier_header'
            - in: header
              name: Event-Identifier
              required: true
              description: The webhook topic name of the event.
              schema:
                type: string
                enum:
                - subscription_created
            post:
              summary: Subscription Created
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SubscriptionEntity'
              responses:
                '200':
                  description: Successful operation
        Subscription updated:
          '{$request.body#/webhook_subscription.callback_url}':
            parameters:
            - $ref: '#/components/parameters/event_actor_type_header'
            - $ref: '#/components/parameters/shop_identifier_header'
            - in: header
              name: Event-Identifier
              required: true
              description: The webhook topic name of the event.
              schema:
                type: string
                enum:
                - subscription_updated
            post:
              summary: Subscription Updated
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SubscriptionEntity'
              responses:
                '200':
                  description: Successful operation
        Subscription order created:
          '{$request.body#/webhook_subscription.callback_url}':
            parameters:
            - $ref: '#/components/parameters/event_actor_type_header'
            - $ref: '#/components/parameters/shop_identifier_header'
            - in: header
              name: Event-Identifier
              required: true
              description: The webhook topic name of the event.
              schema:
                type: string
                enum:
                - subscription_order_created
            post:
              summary: Subscription Order Created
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SubscriptionOrder'
              responses:
                '200':
                  description: Successful operation
        Customer created:
          '{$request.body#/webhook_subscription.callback_url}':
            parameters:
            - $ref: '#/components/parameters/event_actor_type_header'
            - $ref: '#/components/parameters/shop_identifier_header'
            - in: header
              name: Event-Identifier
              required: true
              description: The webhook topic name of the event.
              schema:
                type: string
                enum:
                - customer_created
            post:
              summary: Customer Created
