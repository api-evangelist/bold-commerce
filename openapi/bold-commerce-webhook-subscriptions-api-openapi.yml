  /subscriptions/v1/shops/{shop_identifier}/webhooks/subscriptions/{webhook_subscription_id}:
    parameters:
    - $ref: '#/components/parameters/shop_identifier_path_param'
    - $ref: '#/components/parameters/webhook_subscription_id_path_param'
    get:
      summary: Get Webhook Subscription
      operationId: GetWebhookSubscription
      tags:
      - Webhook Subscriptions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: Retrieve a webhook subscription by its id.
    put:
      summary: Update Webhook Subscription
      operationId: UpdateWebhookSubscription
      tags:
      - Webhook Subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscription'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: Update a webhook subscription by its id.
    delete:
      tags:
      - Webhook Subscriptions
      summary: Delete Webhook Subscription
      operationId: DeleteWebhookSubscription
      responses:
        '200':
          description: Successful operation
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: Delete a webhook subscription by its id.
components:
  schemas:
    SubscriptionOrderCountEntity:
      properties:
        order_count:
          description: The number of orders created for the subscription.
          type: integer
          example: 1
    Subscription:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionEntity'
    SubscriptionNotesEntity:
      properties:
        note:
          description: An internal-only note that you can add to a subscription. For a subscription recurrence, this note appears in the Additional Details section of the created order. Applicable for Shopify Checkout only.
          type:
          - string
          - 'null'
          example: Staff note
        order_note:
          description: A customer-facing note that you can add to a subscription. For the first order, this field retains the note added by the customer. For a subscription recurrence, this note appears in the Note section of the created order. Applicable for Shopify Checkout only.
          type:
          - string
          - 'null'
          example: Customer note
    PaymentMethodEntity:
      type: object
      properties:
        type:
          type: string
          example: credit_card
          enum:
          - credit_card
          - paypal
          - shop_pay
        name:
          type:
          - string
          - 'null'
          example: John Doe
          description: Customer's name
        billing_address:
          type:
          - object
          - 'null'
          description: Customer's billing address.
          properties:
            street:
              type:
              - string
              - 'null'
              example: 123 Main Street
              description: The customer's street address.
            city:
              type:
              - string
              - 'null'
              example: Toronto
              description: The customer's city.
            province:
              type:
              - string
              - 'null'
              example: Ontario
              description: The customer's province or state, as applicable.
            country:
              type:
              - string
              - 'null'
              example: Canada
              description: The customer's country name.
            zip:
              type:
              - string
              - 'null'
              example: H0H 0H0
              description: The customer's postal code.
        public_id:
          type:
          - string
          - 'null'
          example: jik1w6HrCn17CxXPDkWhtgyqvm8wLDd1PelY6k8mabglNmL8XKBnsde9PdgKZqnG
        update_method:
          type:
          - string
          - 'null'
          example: trigger_email
          enum:
          - trigger_email
          - embedded
          - url
        cc_type:
          type:
          - string
          - 'null'
          example: Visa
        expiration:
          type:
          - object
          - 'null'
          required:
          - date
          - timezone_type
          - timezone
          properties:
            date:
              type:
              - string
              - 'null'
              example: 2020-5
            timezone_type:
              type:
              - string
              - 'null'
            timezone:
              type:
              - string
              - 'null'
              example: UTC
        last_four:
          type:
          - string
          - 'null'
          example: '1111'
        is_default:
          type:
          - boolean
          - 'null'
          example: true
        paypal_email:
          type:
          - string
          - 'null'
          example: customer@example.com
          format: email
        update_url:
          type:
          - object
          - 'null'
          required:
          - url
          - expiry
          properties:
            url:
              type: string
              format: uri
            expiry:
              type: string
              format: date-time
        embed_url:
          type:
          - object
          - 'null'
          properties:
            url:
              type: string
              format: uri
            expiry:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - url
          - expiry
      required:
      - type
      - public_id
      - update_method
      - cc_type
      - expiration
      - last_four
      - is_default
      - paypal_email
      - update_url
      readOnly: true
    CustomerSubscriptionSummary:
      type: object
      required:
      - bold_platform_customer_id
      - next_order_date
      - last_order_date
      - active_subscription_count
      - inactive_subscription_count
      - subscription_order_count
      - lifetime_value_usd
      description: Summary of the customer's subscriptions.
      properties:
        bold_platform_customer_id:
          type: integer
          description: The customer's ID.
          example: 2
          readOnly: true
        next_order_date:
          type: string
          description: The cext order date and time for the subscription.
          example: '2020-01-20T18:00:00Z'
          readOnly: true
        last_order_date:
          type: string
          description: The most recent order date and time for a subscription.
          example: '2019-11-20T20:55:27Z'
          readOnly: true
        active_subscription_count:
          type: integer
          description: The number of active subscriptions.
          example: 2
          readOnly: true
        inactive_subscription_count:
          type: integer
          description: The number of inactive subscriptions.
          example: 1
          readOnly: true
        subscription_order_count:
          type: integer
          description: The number of subscription orders for this customer. Initial orders count toward this total.
          example: 5
          readOnly: true
        lifetime_value_usd:
          type: number
          description: The total value of the order made by this customer in USD.
          example: 152.12
          readOnly: true
    OrderEntity:
      type: object
      x-examples: {}
      title: ''
      properties:
        id:
          type: integer
          example: 185490
        platform_id:
          type: integer
          example: 1
        platform_customer_id:
          type: integer
          example: 123
        shop_identifier:
          type: string
          example: zya0kzb8hu
        line_items:
          type: array
          items:
