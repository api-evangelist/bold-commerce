openapi: 3.2.0
info:
  title: Bold Subscriptions Subscription Line Items API
  version: '1.0'
  description: 'Bold Subscriptions customers use our API to interact with subscription data in unique ways. This includes the ability to modify, cancel, and report on subscriptions.


    Refer to the changelog for the latest updates to this API.'
  termsOfService: https://boldcommerce.com/terms-of-service
  contact:
    name: Contact Us
    url: https://developer-dashboard.boldcommerce.com/default/contactus
servers:
- url: https://api.boldcommerce.com
security:
- OAuthToken: []
- APIAccessToken: []
tags:
- name: Subscription Line Items
  description: A child resource of Subscriptions. Contains information about line items in a subscription, including price, details, and swappable products. Use these endpoints to get, remove, edit, or list line items for subscriptions.
paths:
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/products_swap:
    put:
      tags:
      - Subscription Line Items
      summary: Swap Line Items
      operationId: SwapLineItems
      description: Swap line item products on a subscription.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapProduct'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/line_items:
    parameters:
    - $ref: '#/components/parameters/shop_identifier_path_param'
    - $ref: '#/components/parameters/subscription_id_path_param'
    patch:
      tags:
      - Subscription Line Items
      summary: Update Line Items
      operationId: UpdateLineItems
      description: 'Update the line items of a subscription. Refer to Manage Subscription Line Items for more information about the use cases of this endpoint.


        When updating the price of the line item, change the `price` field in the request body. This value must be in the `charged_currency` of the subscription, and it must be in the base currency unit (i.e., cents). This price is the final output price of the line item on this order; any applicable subscription group discounts or price changes will not be applied.


        *Example:

        If you include price: 4000 in the request body, the line item price is set to $40.00 CAD for all upcoming orders.*'
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionLineItems'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionUpdateLineItems'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/line_items/{line_item_id}:
    delete:
      tags:
      - Subscription Line Items
      summary: Delete Line Item
      operationId: DeleteLineItem
      description: Delete a line item from a subscription.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      - $ref: '#/components/parameters/line_item_id_path_param'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
    get:
      tags:
      - Subscription Line Items
      summary: Get Line Item
      operationId: GetLineItem
      description: Retrieve the details of a specific line item from a given subscription.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      - $ref: '#/components/parameters/line_item_id_path_param'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription_line_item:
                    $ref: '#/components/schemas/LineItemEntity'
              examples:
                success-example:
                  value:
                    subscription_line_item:
                      id: 1
                      subscription_id: 1
                      platform_id: ABC123
                      platform_product_id: '1357908642'
                      platform_variant_id: '2468097531'
                      subscription_group_id: 1
                      subscription_group_billing_rules_id: 1
                      title: Monthly Expansion Pack
                      product_name: Monthly Expansion Pack
                      variant_name: Default Title
                      sku: SKU-113-Red
                      url: https://example-store.example.com/monthly-expansion-pack
                      image: ''
                      quantity: 1
                      price: 3500
                      price_charged: 3200
                      discounted_price: 3200
                      discounted_price_charged: 3200
                      full_price: 3200
                      full_price_charged: 3200
                      requires_shipping: false
                      grams: 2200
                      weight: 2.2
                      weight_unit: kg
                      taxable: true
                      discounts:
                      - id: 1
                        subscription_line_item_id: 1
                        shop_id: 5
                        full_price: 5
                        discount_type: percentage
                        percentage_value: 10
                        fixed_value: 0
                        fixed_value_charged: 0
                        description: Subscription discount (10%) for Monthly Expansion Pack
                        created_at: '2019-11-20T20:31:55Z'
                        updated_at: '2019-11-20T20:31:55Z'
                        deleted_at: '2019-11-20T20:31:55Z'
                      prepaid_metadata:
                        id: 1
                        line_item_id: 2
                        prepaid_duration: 2
                        current_recurrence_count: 2
                        prepaid_continue: no_continue
                      line_item_attributes:
                      - name: size_preference
                        value: XL
                        created_at: '2021-01-17T20:30:40Z'
                        updated_at: '2021-01-17T20:30:40Z'
                        subscription_id: 1
                        line_item_id: 1
                      created_at: '2019-11-20T20:31:55Z'
                      updated_at: '2019-11-20T20:31:55Z'
        '404':
          description: Subscription or line item not found
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/line_items/{line_item_id}/products_swap:
    parameters:
    - $ref: '#/components/parameters/shop_identifier_path_param'
    - $ref: '#/components/parameters/subscription_id_path_param'
    - $ref: '#/components/parameters/line_item_id_path_param'
    get:
      tags:
      - Subscription Line Items
      summary: List Swappable Products by Line Item
      operationId: ListSwappableProductsByLineItem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwappableProducts'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: Retrieve a list of swappable products for a subscription line item.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      - $ref: '#/components/parameters/line_item_id_path_param'
      - schema:
          type: integer
        in: query
        name: limit
        description: Maximum number of results to be returned
      - schema:
          type: integer
        in: query
        name: page
        description: The desired page number for the paginated result
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/line_items/{line_item_id}/attributes:
    parameters:
    - $ref: '#/components/parameters/shop_identifier_path_param'
    - $ref: '#/components/parameters/subscription_id_path_param'
    - $ref: '#/components/parameters/line_item_id_path_param'
    post:
      description: Add a new set of attributes to a line item.
      tags:
      - Subscription Line Items
      summary: Create Line Item Attributes
      operationId: CreateLineItemAttributes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  line_item_attributes:
                    type: array
                    items:
                      $ref: '#/components/schemas/LineItemAttributeEntity'
              examples:
                success-example:
                  value:
                    line_item_attributes:
                    - name: size_preference
                      value: XL
                      created_at: '2021-01-17T20:30:40Z'
                      updated_at: '2021-01-17T20:30:40Z'
                      subscription_id: 1
                      line_item_id: 1
                    - name: color_preference
                      value: green
                      created_at: '2021-01-17T20:30:40Z'
                      updated_at: '2021-01-17T20:30:40Z'
                      subscription_id: 1
                      line_item_id: 1
        '404':
          description: Subscription or line item not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                line_item_attributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/LineItemAttributeEntity'
            examples:
              request-body-example:
                value:
                  line_item_attributes:
                  - name: size_preference
                    value: XL
                  - name: color_preference
                    value: green
    patch:
      tags:
      - Subscription Line Items
      summary: Update Line Item Attributes
      operationId: UpdateLineItemAttributes
      description: 'Create, remove, or update attributes for a specific line item inside a subscription. Your request payload must contain the full list of attributes for the line item.


        To add an attribute to the line item, include a new attribute in the request payload. To update an attribute that already exists on the line item, include the attribute in the payload with the same name and an updated value. To delete one attribute, leave the attribute out of the request payload. To remove all attributes of a line item, use an empty array as the request payload.'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription_line_item:
                    $ref: '#/components/schemas/LineItemEntity'
              examples:
                success-example:
                  value:
                    subscription_line_item:
                      id: 1
                      subscription_id: 1
                      platform_id: ABC123
                      platform_product_id: '1357908642'
                      platform_variant_id: '2468097531'
                      subscription_group_id: 1
                      subscription_group_billing_rules_id: 1
                      title: Monthly Expansion Pack
                      product_name: Monthly Expansion Pack
                      variant_name: Default Title
                      sku: SKU-113-Red
                      url: https://example-store.example.com/monthly-expansion-pack
                      image: ''
                      quantity: 1
                      price: 3500
                      price_charged: 3200
                      discounted_price: 3200
                      discounted_price_charged: 3200
                      full_price: 3200
                      full_price_charged: 3200
                      requires_shipping: false
                      grams: 2200
                      weight: 2.2
                      weight_unit: kg
                      taxable: true
                      discounts:
                      - id: 1
                        subscription_line_item_id: 1
                        shop_id: 5
                        full_price: 5
                        discount_type: percentage
                        percentage_value: 10
                        fixed_value: 0
                        fixed_value_charged: 0
                        description: Subscription discount (10%) for Monthly Expansion Pack
                        created_at: '2019-11-20T20:31:55Z'
                        updated_at: '2019-11-20T20:31:55Z'
                        deleted_at: '2019-11-20T20:31:55Z'
                      prepaid_metadata:
                        id: 1
                        line_item_id: 2
                        prepaid_duration: 2
                        current_recurrence_count: 2
                        prepaid_continue: no_continue
                      line_item_attributes:
                      - name: size_preference
                        value: XL
                        created_at: '2021-01-17T20:30:40Z'
                        updated_at: '2021-01-17T20:30:40Z'
                        subscription_id: 1
                        line_item_id: 1
                      - name: color_preference
                        value: green
                        created_at: '2021-01-17T20:30:40Z'
                        updated_at: '2021-01-17T20:30:40Z'
                        subscription_id: 1
                        line_item_id: 1
                      created_at: '2019-11-20T20:31:55Z'
                      updated_at: '2019-11-20T20:31:55Z'
        '404':
          description: Subscription or line item not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                line_item_attributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/LineItemAttributeEntity'
            examples:
              request-body-example:
                value:
                  line_item_attributes:
                  - name: size_preference
                    value: XL
                  - name: color_preference
                    value: green
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/line_items/{line_item_id}/prepaid_metadata:
    parameters:
    - $ref: '#/components/parameters/shop_identifier_path_param'
    - $ref: '#/components/parameters/subscription_id_path_param'
    - $ref: '#/components/parameters/line_item_id_path_param'
    post:
      tags:
      - Subscription Line Items
      summary: Create Line Item Prepaid Metadata
      operationId: CreateLineItemPrepaidMetadata
      description: 'Add prepaid metadata to a line item to convert a subscription to prepaid. Adding this metadata to one line item converts the whole order to prepaid.


        **Note:** Converting a subscription to prepaid does not automatically charge the customer for the balance of the prepaid subscription. To charge the customer the prepaid subscription amount on the next recurrence, set `prepaid_duration` to the same value as `prepaid_recurrence_count`, and set `prepaid_continue` to `as_prepaid`. This causes Bold to start a new prepaid subscription on the next recurrence and set the `prepaid_recurrence_count` back to `1`.'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  prepaid_metadata:
                    $ref: '#/components/schemas/PrepaidMetadataEntity'
              examples:
                success-example:
                  value:
                    prepaid_metadata:
                      id: 1
                      line_item_id: 2
                      prepaid_duration: 2
                      current_recurrence_count: 2
                      prepaid_continue: no_continue
        '404':
          description: Subscription or Line Item Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prepaid_metadata:
                  $ref: '#/components/schemas/PrepaidMetadataEntity'
            examples:
              request-body-example:
                value:
                  prepaid_metadata:
                    prepaid_continue: as_prepaid
                    prepaid_duration: 6
                    current_recurrence_count: 6
    patch:
      summary: Update Line Item Prepaid Metadata
      operationId: UpdateLineItemPrepaidMetadata
      tags:
      - Subscription Line Items
      description: 'Update or create new prepaid metadata for a line item.


        **Note:** Updating the `prepaid_duration` or `current_recurrence_count` does not result in any automatic charges or change in charges to an existing prepaid customer. Adding new prepaid metadata to a subscription converts it to prepaid. For more information on converting a subscription to prepaid, refer to the Create Line Item Prepaid Metadata endpoint.'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  prepaid_metadata:
                    $ref: '#/components/schemas/PrepaidMetadataEntity'
              examples:
                success-example:
                  value:
                    prepaid_metadata:
                      id: 1
                      line_item_id: 2
                      prepaid_duration: 2
                      current_recurrence_count: 2
                      prepaid_continue: no_continue
        '404':
          description: Subscription or Line Item Not Found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prepaid_metadata:
                  $ref: '#/components/schemas/PrepaidMetadataEntity'
            examples:
              request-body-example:
                value:
                  prepaid_metadata:
                    prepaid_continue: no_continue
                    prepaid_duration: 6
                    current_recurrence_count: 6
components:
  schemas:
    SwappableProducts:
      properties:
        swappable_products:
          type: array
          items:
            $ref: '#/components/schemas/SwappableProductEntity'
        pagination:
          $ref: '#/components/schemas/StandardPaginationEntity'
      type: object
    SubscriptionOrderCountEntity:
      properties:
        order_count:
          description: The number of orders created for the subscription.
          type: integer
          example: 1
    PatchLineItemEntity:
      type: object
      title: ''
      description: The line item to be updated. Fields marked as **read-only** cannot be updated using this endpoint. Use the property's existing value for those fields.
      properties:
        id:
          type:
          - integer
          - 'null'
          example: 1
          description: "**Read-only.** \n\nLine item identifier."
        subscription_id:
          type:
          - integer
          - 'null'
          example: 1
          description: "**Read-only.** \n\nSubscription identifier."
        platform_id:
          type: string
          example: ABC123
          description: "**Read-only.** \n\nIdentifier from the platform."
        platform_product_id:
          type:
          - string
          - 'null'
          example: '1357908642'
          description: "**Read-only.** \n\nProduct identifier from the platform."
        platform_variant_id:
          type:
          - string
          - 'null'
          example: '2468097531'
          description: "**Read-only.** \n\nVariant identifier from the platform."
        subscription_group_id:
          type: integer
          example: 1
          description: Subscription group identifier.
        subscription_group_billing_rules_id:
          type:
          - integer
          - 'null'
          example: 1
          description: Billing rules identifier for the subscription group.
        title:
          type: string
          example: Monthly Expansion Pack
          description: Line item title.
        product_name:
          type:
          - string
          - 'null'
          example: Monthly Expansion Pack
          description: "**Read-only.** \n\nProduct name."
        variant_name:
          type:
          - string
          - 'null'
          example: Default Title
          description: "**Read-only.** \n\nVariant name."
        sku:
          type: string
          example: SKU-113-Red
          description: Product SKU.
        url:
          type: string
          example: https://example-store.example.com/monthly-expansion-pack
          description: "**Read-only.** \n\nProduct URL."
        image:
          type: string
          example: ''
          description: Product image.
        quantity:
          type: integer
          example: 1
          description: Product quantity.
        price:
          type:
          - integer
          - 'null'
          example: 3500
          description: Product price. If changed, all related `price` fields may be impacted. If omitted, the price will be used from the exising line item when updating or the matching product when adding a new line item.
        price_charged:
          type:
          - integer
          - 'null'
          example: 3200
          description: "**Read-only.** \n\nInfluenced by changes made to the `price` field."
        discounted_price:
          type: integer
          example: 3200
          description: "**Read-only.** \n\nInfluenced by changes made to the `price` field."
        discounted_price_charged:
          type: integer
          example: 3200
          description: "**Read-only.** \n\nInfluenced by changes made to the `price` field."
        full_price:
          type: integer
          example: 3200
          description: "**Read-only.** \n\nInfluenced by changes made to the `price` field."
        full_price_charged:
          type: integer
          example: 3200
          description: "**Read-only.** \n\nInfluenced by changes made to the `price` field."
        requires_shipping:
          type: boolean
          example: false
          description: Whether or not the line item requires shipping.
        grams:
          type: integer
          example: 2200
          description: Product weight in grams.
        weight:
          type: number
          example: 2.2
          description: Product weight in `weight_unit`.
        weight_unit:
          type: string
          example: kg
          description: Unit used for `weight`.
        taxable:
          type: boolean
          example: true
          description: Whether or not the line item is taxable.
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDiscountEntity'
          description: "**Read-only.** \n\nAll discounts associated with the line item."
        prepaid_metadata:
          type:
          - object
          - 'null'
          description: '**Read-only.**


            Prepaid properties, as defined in the [Create Line Item Prepaid Metadata](/api/subscriptions#tag/Subscription-Line-Items/operation/CreateLineItemPrepaidMetadata) and [Update Line Item Prepaid Metadata](/api/subscriptions#tag/Subscription-Line-Items/operation/UpdateLineItemPrepaidMetadata) endpoint. Set to `null` when using the [Update Subscription Line Items](/api/subscriptions#tag/Subscription-Line-Items/operation/UpdateLineItems) endpoint.'
          enum:
          - null
          example: null
        line_item_attributes:
          type: array
          items:
            $ref: '#/components/schemas/LineItemAttributeEntity'
          description: "**Read-only.** \n\nAdditional attributes associated with the line item. \n\nUse the [Update Line Item Attributes](subscriptions#operation/UpdateLineItemAttributes) endpoint to add, update, or delete line item attributes."
        created_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
        updated_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
      required:
      - id
      - subscription_id
      - platform_id
      - platform_product_id
      - platform_variant_id
      - subscription_group_id
      - subscription_group_billing_rules_id
      - title
      - product_name
      - variant_name
      - sku
      - url
      - image
      - quantity
      - price_charged
      - discounted_price
      - discounted_price_charged
      - full_price
      - requires_shipping
      - grams
      - weight
      - weight_unit
      - taxable
      - discounts
      - prepaid_metadata
      readOnly: true
    Subscription:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionEntity'
    SubscriptionUpdateLineItems:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionUpdateLineItemsEntity'
    UpdateLineItemEntity:
      type: object
      title: ''
      properties:
        id:
          type:
          - integer
          - 'null'
          example: 1
        subscription_id:
          type:
          - integer
          - 'null'
          example: 1
        platform_id:
          type: string
          example: ABC123
        platform_product_id:
          type:
          - string
          - 'null'
          example: '1357908642'
        platform_variant_id:
          type:
          - string
          - 'null'
          example: '2468097531'
        subscription_group_id:
          type: integer
          example: 1
        subscription_group_billing_rules_id:
          type:
          - integer
          - 'null'
          example: 1
        title:
          type: string
          example: Monthly Expansion Pack
        product_name:
          example: null
          description: Always returns `null`.
        variant_name:
          example: null
          description: Always returns `null`.
        sku:
          type: string
          example: SKU-113-Red
        url:
          type: string
          example: https://example-store.example.com/monthly-expansion-pack
        image:
          type: string
          example: ''
        quantity:
          type: integer
          example: 1
        price:
          type: integer
          example: 3500
        price_charged:
          type:
          - integer
          - 'null'
          example: 3200
        discounted_price:
          type: integer
          example: 3200
        discounted_price_charged:
          type: integer
          example: 3200
        full_price:
          type: integer
          example: 3200
        full_price_charged:
          type: integer
          example: 3200
        requires_shipping:
          type: boolean
          example: false
        grams:
          type: integer
          example: 2200
        weight:
          type: number
          example: 2.2
        weight_unit:
          type: string
          example: kg
        taxable:
          type: boolean
          example: true
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDiscountEntity'
          readOnly: true
        prepaid_metadata:
          type:
          - object
          - 'null'
          required:
          - id
          - line_item_id
          - prepaid_duration
          - current_recurrence_count
          - prepaid_continue
          properties:
            id:
              type:
              - integer
              - 'null'
              example: 1
            line_item_id:
              type:
              - integer
              - 'null'
              example: 2
            prepaid_duration:
              type: integer
              example: 2
            current_recurrence_count:
              type: integer
              example: 2
            prepaid_continue:
              type: string
              enum:
              - no_continue
              - as_prepaid
              - as_standard
        line_item_attributes:
          type: array
          items:
            $ref: '#/components/schemas/LineItemAttributeEntity'
        created_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
        updated_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
      required:
      - id
