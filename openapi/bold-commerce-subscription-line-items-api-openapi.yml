        value:
          type: integer
          description: The price of the shipping line, in base units (e.g., cents) of the `base_currency` of the associated subscription. For example, a value of `1000` on a subscription with a base currency of USD corresponds to a $10.00 USD shipping line price.
          example: 1000
          readOnly: true
        value_charged:
          type:
          - integer
          - 'null'
          description: The price of the shipping line, in base units (e.g., cents) of the `charged_currency` of the associated subscription. For example, a value of `1000` on a subscription with a charged currency of CAD corresponds to a $10.00 CAD shipping line price.
          example: 1000
          readOnly: true
        tag:
          type:
          - string
          - 'null'
          example: Shipping
          readOnly: true
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in [RFC3339 format](https://datatracker.ietf.org/doc/html/rfc3339)) that this shipping line was created.
          example: '2019-10-20T20:31:55Z'
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date (in [RFC3339 format](https://datatracker.ietf.org/doc/html/rfc3339)) that this shipping line was last updated. The value is the same as the `created_at` value if the shipping line has never been updated.
          example: '2019-11-20T20:31:55Z'
          readOnly: true
        subscription_id:
          type:
          - integer
          - 'null'
          description: The ID of the subscription the shipping line belongs to.
          example: 1
          readOnly: true
      required:
      - id
      - name
      - code
      - price
      - value
      - value_charged
      - tag
      - created_at
      - updated_at
      - subscription_id
      readOnly: true
    StandardPaginationEntity:
      properties:
        total:
          type: integer
          readOnly: true
          example: 2
        count:
          type: integer
          readOnly: true
          example: 2
        per_page:
          type: integer
          readOnly: true
          example: 10
        total_pages:
          type: integer
          readOnly: true
          example: 1
        current_page:
          type: integer
          readOnly: true
          example: 1
      type: object
      readOnly: true
    PrepaidMetadataEntity:
      type: object
      properties:
        id:
          description: The ID of the prepaid metadata.
          type: integer
          example: 1
        line_item_id:
          description: The ID of the subscription line item this prepaid metadata belongs to.
          type: integer
          example: 1
        prepaid_continue:
          description: "The behavior of the subscription once the number of recurrences has reached the `prepaid_duration`.\n  * `no_continue`: The subscription will be cancelled.\n  * `as_prepaid` : The customer will be charged for new set of order recurrences on the next recurrence.\n  * `as_standard`: The subscription will be converted to a standard subscription, where the customer is charged for one order at each recurrence."
          type: string
          enum:
          - no_continue
          - as_prepaid
          - as_standard
          example: as_prepaid
        prepaid_duration:
          description: The number of subscription recurrences that have been prepaid.
          type: integer
          example: 6
        current_recurrence_count:
          description: The number of subscription recurrences that have occurred.
          type: integer
          example: 6
      required:
      - prepaid_continue
      - prepaid_duration
      - current_recurrence_count
    CustomerAddressEntity:
      type: object
      required:
      - id
      - shop_identifier
      - platform_id
      - customer_id
      - platform_type
      - platform_customer_id
      - first_name
      - last_name
      - company
      - phone
      - street1
      - street2
      - city
      - province
      - province_code
      - country
      - country_code
      - zip
      - is_default
      - address_use
      - address_source
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
          type: integer
          description: The address ID.
          readOnly: true
          example: 1
        shop_identifier:
          type: string
          description: The platform shop identifier.
          readOnly: true
          example: '12345'
        platform_id:
          type: string
          description: The platform address identifier.
          readOnly: true
          example: '14'
        customer_id:
          type: integer
          description: The customer ID.
          readOnly: true
          example: 2
        platform_type:
          type: string
          enum:
          - bigcommerce
          - commercetools
          - custom
          - shopify
          - woocommerce
          description: The e-commerce platform being used by the shop (might also be 'custom' for no specific e-commerce platform).
          readOnly: true
          example: shopify
        platform_customer_id:
          type: string
          readOnly: true
          description: The ID of the customer on the platform.
          example: '35'
        first_name:
          type: string
          description: The customer's first name.
          example: John
        last_name:
          type: string
          description: The customer's last name(s).
          example: Doe
        company:
          type: string
          description: The customer's company name.
          example: Example Company
        phone:
          type: string
          description: The customer's phone number.
          example: 123-456-7890
        street1:
          type: string
          description: The customer's street address (street name and number).
          example: 123 example st.
        street2:
          type: string
          description: The address complement (suite number, unit number, etc.).
          example: '101'
        city:
          type: string
          description: The customer's city.
          example: Toronto
        province:
          type: string
          description: The customer's province or state, as applicable. Can be an empty string in case the address has no state/province.
          example: Ontario
        province_code:
          type: string
          description: The customer's province or state code (usually 2 characters), as applicable. Can be an empty string in case the address has no state/province.
          example: 'ON'
        country:
          type: string
          description: The customer's country name.
          example: Canada
        country_code:
          type: string
          description: 'The customer''s alpha 2 country code, according to ISO 3166-1 (reference: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).'
          example: CA
        zip:
          type: string
          description: The customer's postal code.
          example: M5V 3L9
        is_default:
          type: boolean
          description: Defines if this address should be considered the default one for the customer.
          example: true
        address_use:
          type:
          - string
          - 'null'
          description: The address usage (billing, shipping). Only set for WooCommerce, `null` otherwise.
          example: billing
        address_source:
          type: string
          description: The address source.
          enum:
          - platform
          - bold
          readOnly: true
          example: platform
        created_at:
          $ref: '#/components/schemas/createdAt'
        updated_at:
          $ref: '#/components/schemas/updatedAt'
        deleted_at:
          $ref: '#/components/schemas/deletedAt'
