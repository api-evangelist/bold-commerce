  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/shipping_address:
    post:
      tags:
        - Subscriptions
      summary: Update Subscription Shipping Address
      operationId: UpdateSubscriptionShippingAddress
      description: |-
        Update the shipping address on a subscription. The update is recorded in the
        subscription activity log and sets `address_source` to `bold` on the resulting address.

        Use this endpoint to reliably sync customer address changes to active subscriptions
        without workarounds such as `PartialUpdateSubscription`.
      parameters:
        - $ref: '#/components/parameters/shop_identifier_path_param'
        - $ref: '#/components/parameters/subscription_id_path_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipping_address
              properties:
                shipping_address:
                  $ref: '#/components/schemas/UpdateCustomerAddressEntity'
            examples:
              request-body-example:
                value:
                  shipping_address:
                    first_name: Jane
                    last_name: Doe
                    company: ''
                    phone: '12045551234'
                    street1: 123 Alphabet St.
                    street2: ''
                    city: Austin
                    province: Texas
                    province_code: TX
                    country: United States
                    country_code: US
                    zip: '78701'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                success-example:
                  value:
                    subscription:
                      id: 1
                      shipping_address_id: 11697813
                      shipping_address:
                        id: 11697813
                        first_name: Jane
                        last_name: Doe
                        company: ''
                        phone: '12045551234'
                        street1: 123 Alphabet St.
                        street2: ''
                        city: Austin
                        province: Texas
                        province_code: TX
                        country: United States
                        country_code: US
                        zip: '78701'
                        is_default: false
                        address_source: bold
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                  - invalid shipping address
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
        '404':
          description: Subscription Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                  - subscription not found
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
              example:
                errors:
                  - province_code is required for addresses in this country
