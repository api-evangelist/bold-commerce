        subscription_group_billing_rules_id:
          type: integer
          example: 1
          nullable: true
          description: Billing rules identifier for the subscription group.
        title:
          type: string
          example: Monthly Expansion Pack
          description: Line item title.
        product_name:
          type: string
          example: Monthly Expansion Pack
          nullable: true
          description: |-
            **Read-only.** 

            Product name.
        variant_name:
          type: string
          example: Default Title
          nullable: true
