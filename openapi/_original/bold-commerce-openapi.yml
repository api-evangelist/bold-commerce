  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/alternative_payments:
    parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
    get:
      summary: List Alternative Payment Methods
      operationId: ListAlternativePaymentMethods
      tags:
        - Payment Methods
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlternatePaymentMethod'
      description: Retrieve a list of alternative payment methods for a subscription.
    post:
      summary: Create Alternative Payment Method
      operationId: CreateAlternativePaymentMethods
      tags:
        - Payment Methods
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  alternative_payment_methods:
                    type: array
                    uniqueItems: true
                    minItems: 1
                    items:
                      required:
                        - subscription_id
                        - public_payment_token
                      properties:
                        subscription_id:
                          type: number
                        public_payment_token:
                          type: string
                          minLength: 1
                required:
                  - alternative_payment_methods
              examples:
                example-1:
                  value:
                    alternative_payment_methods:
                      - subscription_id: 0
                        public_payment_token: string
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                alternative_payment_methods:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        minLength: 1
                      payment_details:
                        type: object
                        properties:
                          card_number:
                            type: string
                            minLength: 1
                          security_key:
                            type: string
                        required:
                          - card_number
                          - security_key
                    required:
                      - type
              required:
                - alternative_payment_methods
            examples:
              example-1:
                value:
                  alternative_payment_methods:
                    - type: gift_card
                      payment_details:
                        card_number: ABC1234
                        security_key: '123'
              example-2:
                value:
                  alternative_payment_methods:
                    - type: string
                      payment_details:
                        card_number: string
                        security_key: '0'
        description: ''
      description: Add an alternate payment method to a subscription.
