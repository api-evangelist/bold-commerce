        - Webhook Events
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEvents'
              examples:
                example:
                  value:
                    webhook_events:
                      - id: 0
                        shop_id: 0
                        webhook_subscription_id: 0
                        webhook_topic_id: 0
                        uuid: string
                        attempts: 0
                        last_response_status_code: string
                        delivered_at: string
                        created_at: '2019-11-20T20:31:55Z'
                        updated_at: '2019-11-20T20:31:55Z'
                        deleted_at: null
                    pagination:
                      limit: 10
                      count: 1
                      total: 1
                      total_pages: 1
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
      description: Retrieve a list of webhook events.
      parameters:
        - $ref: '#/components/parameters/shop_identifier_path_param'
        - schema:
            type: integer
          in: query
          name: since_id
        - schema:
            type: string
          in: query
          name: limit
          description: Maximum number of results to be returned
        - schema:
            type: array
            items:
              type: string
              enum:
                - shop_id
                - webhook_subscription_id
                - webhook_topic_id
                - uuid
                - attempts
                - last_response_status_code
                - id
                - created_at
                - updated_at
                - delivered_at
          in: query
          name: filters
          description: Filter event webhooks. Mulitple filters can be passed in the array.
