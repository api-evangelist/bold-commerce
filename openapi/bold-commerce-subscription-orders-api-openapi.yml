openapi: 3.2.0
info:
  title: Bold Subscriptions Subscription Orders API
  version: '1.0'
  description: 'Bold Subscriptions customers use our API to interact with subscription data in unique ways. This includes the ability to modify, cancel, and report on subscriptions.


    Refer to the changelog for the latest updates to this API.'
  termsOfService: https://boldcommerce.com/terms-of-service
  contact:
    name: Contact Us
    url: https://developer-dashboard.boldcommerce.com/default/contactus
servers:
- url: https://api.boldcommerce.com
security:
- OAuthToken: []
- APIAccessToken: []
tags:
- name: Subscription Orders
  description: A child resource of Subscriptions. Contains information about orders in a subscription, including schedules, order histories, and current orders. Use these endpoints to list, get, skip, or unskip orders.
paths:
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/orders:
    get:
      tags:
      - Subscription Orders
      summary: List Orders
      operationId: ListOrders
      description: Retrieve a list of subscription orders for a subscription.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      - schema:
          type: integer
        in: query
        name: page
        description: The desired page number for the paginated result
      - schema:
          type: integer
        in: query
        description: Maximum number of results to be returned
        name: limit
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionOrders'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/orders/{order_id}:
    get:
      tags:
      - Subscription Orders
      summary: Get Order
      operationId: GetOrder
      description: Retrieve a subscription order for a subscription by its id.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      - $ref: '#/components/parameters/order_id_path_param'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionOrder'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/next_order_datetime:
    put:
      tags:
      - Subscription Orders
      summary: Update Next Order Datetime
      operationId: UpdateNextOrderDatetime
      description: Update the datetime of the next subscription order in RFC 3339 format.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionNextOrderDate'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/recover:
    put:
      tags:
      - Subscription Orders
      summary: Unskip Previously Skipped Order
      operationId: UnskipPreviouslySkippedOrder
      description: Restore a previously skipped future subscription order. Specify the date of the order to be unskipped.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnskipSubscriptionOrder'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
  /subscriptions/v1/shops/{shop_identifier}/subscriptions/{subscription_id}/skip:
    put:
      tags:
      - Subscription Orders
      summary: Skip Subscription Order
      operationId: SkipSubscriptionOrder
      description: Skip a subscription's upcoming order by date.
      parameters:
      - $ref: '#/components/parameters/shop_identifier_path_param'
      - $ref: '#/components/parameters/subscription_id_path_param'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipSubscriptionOrder'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedResponse'
components:
  schemas:
    SubscriptionOrderCountEntity:
      properties:
        order_count:
          description: The number of orders created for the subscription.
          type: integer
          example: 1
    SkipSubscriptionOrder:
      description: Skip an upcoming order for the subscription.
      properties:
        date:
          type: string
          example: '2020-01-20T18:00:00Z'
      type: object
    UpdateSubscriptionNextOrderDate:
      description: Update the next order date and time for the subscription.
      type: object
      properties:
        nextDate:
          type: string
          example: '2020-01-20T18:00:00Z'
        includeFutureOrders:
          type: boolean
          default: false
          description: Also adjust the order datetimes of all future orders to match the new next order date with the old interval.
    Subscription:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionEntity'
    SubscriptionNotesEntity:
      properties:
        note:
          description: An internal-only note that you can add to a subscription. For a subscription recurrence, this note appears in the Additional Details section of the created order. Applicable for Shopify Checkout only.
          type:
          - string
          - 'null'
          example: Staff note
        order_note:
          description: A customer-facing note that you can add to a subscription. For the first order, this field retains the note added by the customer. For a subscription recurrence, this note appears in the Note section of the created order. Applicable for Shopify Checkout only.
          type:
          - string
          - 'null'
          example: Customer note
    SubscriptionOrders:
      properties:
        subscription_orders:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionOrderEntity'
      type: object
    PaymentMethodEntity:
      type: object
      properties:
        type:
          type: string
          example: credit_card
          enum:
          - credit_card
          - paypal
          - shop_pay
        name:
          type:
          - string
          - 'null'
          example: John Doe
          description: Customer's name
        billing_address:
          type:
          - object
          - 'null'
          description: Customer's billing address.
          properties:
            street:
              type:
              - string
              - 'null'
              example: 123 Main Street
              description: The customer's street address.
            city:
              type:
              - string
              - 'null'
              example: Toronto
              description: The customer's city.
            province:
              type:
              - string
              - 'null'
              example: Ontario
              description: The customer's province or state, as applicable.
            country:
              type:
              - string
              - 'null'
              example: Canada
              description: The customer's country name.
            zip:
              type:
              - string
              - 'null'
              example: H0H 0H0
              description: The customer's postal code.
        public_id:
          type:
          - string
          - 'null'
          example: jik1w6HrCn17CxXPDkWhtgyqvm8wLDd1PelY6k8mabglNmL8XKBnsde9PdgKZqnG
        update_method:
          type:
          - string
          - 'null'
          example: trigger_email
          enum:
          - trigger_email
          - embedded
          - url
        cc_type:
          type:
          - string
          - 'null'
          example: Visa
        expiration:
          type:
          - object
          - 'null'
          required:
          - date
          - timezone_type
          - timezone
          properties:
            date:
              type:
              - string
              - 'null'
              example: 2020-5
            timezone_type:
              type:
              - string
              - 'null'
            timezone:
              type:
              - string
              - 'null'
              example: UTC
        last_four:
          type:
          - string
          - 'null'
          example: '1111'
        is_default:
          type:
          - boolean
          - 'null'
          example: true
        paypal_email:
          type:
          - string
          - 'null'
          example: customer@example.com
          format: email
        update_url:
          type:
          - object
          - 'null'
          required:
          - url
          - expiry
          properties:
            url:
              type: string
              format: uri
            expiry:
              type: string
              format: date-time
        embed_url:
          type:
          - object
          - 'null'
          properties:
            url:
              type: string
              format: uri
            expiry:
              type:
              - string
              - 'null'
              format: date-time
          required:
          - url
          - expiry
      required:
      - type
      - public_id
      - update_method
      - cc_type
      - expiration
      - last_four
      - is_default
      - paypal_email
      - update_url
      readOnly: true
    OrderEntity:
      type: object
      x-examples: {}
      title: ''
      properties:
        id:
          type: integer
          example: 185490
        platform_id:
          type: integer
          example: 1
        platform_customer_id:
          type: integer
          example: 123
        shop_identifier:
          type: string
          example: zya0kzb8hu
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItemEntity'
        billing_address:
          description: Orders that were deleted from the platform won't have address information available.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/CustomerAddressEntity'
        shipping_addresses:
          description: Orders that were deleted from the platform won't have address information available.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomerAddressEntity'
        subtotal:
          type: integer
          example: 1337
        subtotal_charged:
          type: integer
          example: 1337
        subtotal_tax:
          type: integer
          example: 144
        subtotal_tax_charged:
          type: integer
          example: 144
        shipping_subtotal:
          example: 1000
          type: integer
        shipping_subtotal_charged:
          type: integer
          example: 1000
        shipping_tax:
          example: 0
          type: integer
        shipping_tax_charged:
          example: 0
          type: integer
        total:
          example: 2204
          type: integer
        total_charged:
          example: 2204
          type: integer
        total_tax:
          example: 144
          type: integer
        total_tax_charged:
          example: 144
          type: integer
        fulfillment_status:
          type: string
          example: pending
        source:
          type: string
        payment_method:
          type: string
          example: Shopify Payments
        payment_method_details:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEntity'
        shipping_method:
          type: string
          example: Subscription shipping
        shipping_rates:
          type: array
          items:
            type: object
            properties:
              id:
                type:
                - integer
                - 'null'
              bold_subscription_id:
                type:
                - number
                - 'null'
              name:
                type: string
              code:
                type:
                - string
                - 'null'
              price:
                type: integer
              price_charged:
                type:
                - integer
                - 'null'
              value:
                type: integer
              value_charged:
                type:
                - integer
                - 'null'
              tag:
                type:
                - string
                - 'null'
              hash:
                type:
                - string
                - 'null'
            required:
            - id
            - bold_subscription_id
            - name
            - code
            - price
            - price_charged
            - value
            - value_charged
            - tag
            - hash
        tax_lines:
          type: array
          items:
            type: object
            properties:
              amount:
                type: integer
              amount_charged:
                type: integer
              name:
                type:
                - string
                - 'null'
              rate:
                type:
                - number
                - 'null'
            required:
            - amount
            - amount_charged
            - name
            - rate
        discounts:
          type: array
          items:
            type: object
            properties:
              discount_percentage:
                type:
                - integer
                - 'null'
                example: 10
              discount_type:
                type:
                - string
                - 'null'
                enum:
                - percentage
                - fixed
                - no_discount
                example: percentage
              text:
                type:
                - string
                - 'null'
                example: 10PERCENTOFF
                readOnly: true
              value:
                type: integer
              value_charged:
                type: integer
            required:
            - discount_percentage
            - discount_type
            - text
            - value
            - value_charged
        order_number:
          type: integer
          example: 0
        currency:
          type: string
          example: CAD
        currency_charged:
          type: string
        currency_format:
          type: string
        currency_format_charged:
          type: string
        exchange_rate:
          type:
          - number
          - 'null'
        test:
          type: boolean
          example: false
        url:
          type: string
          example: https://example-store.example.com/account.php?action=view_order&order_id=1
        updated_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
        created_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
        placed_at:
          type: string
          example: '2019-11-20T20:31:55Z'
          format: date-time
          readOnly: true
        deleted_at:
          type:
          - string
          - 'null'
          example: '2021-07-09T18:13:27Z'
          format: date-time
          readOnly: true
        subscription_id:
          type: integer
          example: 5266
      required:
      - id
      - platform_id
      - platform_customer_id
      - shop_identifier
      - line_items
      - billing_address
      - shipping_addresses
      - subtotal
      - subtotal_charged
      - subtotal_tax
      - subtotal_tax_charged
      - shipping_subtotal
      - shipping_subtotal_charged
      - shipping_tax
      - shipping_tax_charged
      - total
      - total_charged
      - total_tax
      - total_tax_charged
      - fulfillment_status
      - source
      - payment_method
      - payment_method_details
      - shipping_method
      - shipping_rates
      - tax_lines
      - discounts
      - order_number
      - currency
      - currency_charged
      - currency_format
      - currency_format_charged
      - exchange_rate
      - test
      - url
      - updated_at
      - created_at
      - placed_at
      - deleted_at
      - subscription_id
      readOnly: true
    SubscriptionOrder:
      type: object
      properties:
        id:
          type: integer
          example: 1008130
        subscription_id:
          type: integer
          example: 316561
        shop_id:
          type: integer
          example: 6481
        base_to_charged_exchange_rate:
          type: number
          example: 1
        base_currency:
          type: string
          example: CAD
        order:
          $ref: '#/components/schemas/OrderEntity'
        is_multi_currency:
          type: boolean
        created_at:
          type: string
          example: '2021-07-09T18:13:40Z'
        updated_at:
          type:
          - string
          - 'null'
          example: '2021-07-09T18:13:40Z'
      required:
      - id
      - subscription_id
      - shop_id
      - base_to_charged_exchange_rate
      - base_currency
      - order
      - is_multi_currency
      - created_at
      - updated_at
      title: ''
    UnauthenticatedResponse:
      type: object
      properties:
        error:
          type: string
          description: The error summary.
          example: invalid_request
        error_description:
          type: string
          description: The detailed error message.
          example: The access token is missing
      example:
        error: invalid_request
        error_description: The access token is missing
    deletedAt:
      type:
      - string
      - 'null'
      description: The date and time when the object was deleted. Set to `null` when the object was not deleted.
      example: '2022-12-25T00:00:00Z'
      format: date-time
    LineItemAttributeEntity:
      title: LineItemAttributeEntity
      type: object
      description: This represents a custom field that can be defined and used to store complementary information about a subscription line item.
      properties:
        name:
          type: string
          example: size_preference
          description: The name of the custom field/attribute, up to 250 characters.
        value:
          type: string
          example: XL
          description: The content of the custom field/attribute.
        created_at:
          type: string
          format: date-time
          description: The date (in [RFC3339 format](https://datatracker.ietf.org/doc/html/rfc3339)) that this line item attribute was created.
          example: '2021-01-17T20:30:40Z'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: The date (in [RFC3339 format](https://datatracker.ietf.org/doc/html/rfc3339)) that this line item attribute was last updated. The value is the same as the `created_at` value if the line item attribute has never been updated.
          example: '2021-01-17T20:30:40Z'
          readOnly: true
        subscription_id:
          description: The ID of the subscription associated to this line item attribute.
          type: integer
          readOnly: true
          example: 435989
        line_item_id:
          description: The ID of the subscription line item this line item attribute belongs to.
          type: integer
          readOnly: true
          example: 45734
    createdAt:
      type: string
      description: The date and time when the object was created.
      example: '2022-12-25T00:00:00Z'
      format: date-time
      readOnly: true
    SubscriptionOrderEntity:
      properties:
        id:
          type: integer
          example: 151917
        subscription_id:
          type: integer
          example: 5266
        shop_id:
          type: integer
          example: 29875
        currency:
          type: string
          example: CAD
        base_to_charged_exchange_rate:
          type: integer
          example: 1
        base_currency:
          type: string
          example: CAD
        order:
          $ref: '#/components/schemas/OrderEntity'
        is_multi_currency:
          type: boolean
          example: false
        created_at:
          type: string
          readOnly: true
          example: '2019-11-20T20:31:55Z'
          format: date-time
        updated_at:
          type: string
          readOnly: true
          example: '2019-11-20T20:31:55Z'
          format: date-time
      type: object
      readOnly: true
    SubscriptionEntity:
      allOf:
      - type: object
        x-examples: {}
        properties:
          id:
            type: integer
            example: 1
            readOnly: true
          external_id:
            type:
            - string
            - 'null'
          customer:
            example: 'null'
          shop_id:
            type: integer
            example: 1
            readOnly: true
          next_order_datetime:
            type: string
            example: '2020-01-20T18:00:00Z'
          next_payment_datetime:
            type: string
            example: '2020-01-20T18:00:00Z'
          next_processing_datetime:
            type: string
            example: '2020-01-20T18:00:00Z'
          subscription_status:
            type: string
            enum:
            - active
            - inactive
            - paused
            - scheduled
            - processing
            - app_uninstalled
            - waiting_sca_authorization
            example: active
          status_changed_at:
            type: string
            example: '2019-11-20T20:31:55Z'
            format: date-time
            readOnly: true
          sca_url:
            type:
            - string
            - 'null'
            example: https://bank.com/pCkWhtgQQVM8W/sca
            readOnly: true
          payment_method_token:
            type: string
            example: jik1w6HrCn17CxXPcKwHTGqqvm8wLDd1PelY6k8mabglNmL8XKBnsde9PdgKZqnG
          payment_gateway_public_id:
            type:
            - string
            - 'null'
            example: jik1w6HrCn17CxXPcKwHTGqqvm8wLDd1PelY6k8mabglNmL8XKBnsde9PdgKZqnG
          payment_rrule:
            type: string
            example: DTSTART:20200120T180000Z\nRRULE:FREQ=MONTHLY\nEXDATE:20200220T180000Z
          payment_rrule_text:
            type:
            - string
            - 'null'
            example: Monthly
          order_rrule:
            type: string
            example: DTSTART:20200120T180000Z\nRRULE:FREQ=MONTHLY\nEXDATE:20200220T180000Z
          order_rrule_text:
            type:
            - string
            - 'null'
            example: Monthly
          last_payment_datetime:
            type:
            - string
            - 'null'
            example: '2019-11-20T20:55:26Z'
          last_order_datetime:
            type:
            - string
            - 'null'
            example: '2019-11-20T20:55:26Z'
          last_processed_datetime:
            type:
            - string
            - 'null'
            example: '2019-11-20T20:55:26Z'
          current_retries:
            type: integer
            example: 3
          charged_currency:
            type: string
            example: CAD
          base_to_charged_exchange_rate:
            type: integer
            example: 1
          base_currency:
            type: string
            example: CAD
          line_items:
            type: array
            items:
              $ref: '#/components/schemas/LineItemEntity'
            readOnly: true
          shipping_lines:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/ShippingLineEntity'
            readOnly: true
          billing_address:
            $ref: '#/components/schemas/CustomerAddressEntity'
          shipping_address:
            type:
            - object
            - 'null'
            allOf:
            - $ref: '#/components/schemas/CustomerAddressEntity'
          idempotency_key:
            type: string
            example: JwGdN55C4g1z5FXRO8Hp21CMxUxKyo6VcGSf3cUsjCgNyTtoeZcIsGM1We4p7pCe-0
          placed_at:
            type:
            - string
            - 'null'
            example: '2012-11-20T20:31:55Z'
            format: data-time
          created_at:
            type: string
            example: '2019-11-20T20:31:55Z'
            format: date-time
            readOnly: true
          updated_at:
            type: string
            example: '2019-11-20T20:31:55Z'
            format: date-time
            readOnly: true
          percent_discount:
            type:
            - number
            - 'null'
            example: 10
            readOnly: true
          discount_code:
            type: string
            example: DISCOUNTCODE
            readOnly: true
          customer_id:
            type: integer
            example: 1697912
            readOnly: true
          billing_address_id:
            type: integer
            example: 11697812
          shipping_address_id:
            type: integer
            example: 11697812
          orders_processed:
            type:
            - integer
            - 'null'
            example: 1
          last_failure_code:
            type:
            - string
            - 'null'
            example: card_expired
            description: This code may help to identify the type of the error.
            enum:
            - alt_pp_payment_method_required
            - bigcommerce_error
            - card_declined
            - card_expired
            - credit_card_not_found
            - discount_code_use_limit
            - insufficient_funds
            - invalid_billing_address
            - invalid_bold_api_token
            - invalid_card_expiration_month
            - invalid_card_expiration_year
            - invalid_card_number
            - invalid_customer_email
            - invalid_discount_code
            - invalid_payment_method
            - invalid_security_code
            - invalid_shipping_address
            - invalid_zip_code
            - no_payment_provider
            - payment_method_declined
            - plugin_event_failed
            - shopify_error
            - stripe_support_required
            - transaction_declined
            - out_of_stock_product
            - unaccepted_credit_card
            - unknown_error
            - unsupported_card
            - unsupported_purchase_type
